<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <form class="p-4">
        <label for="email" class="p-2">Email</label>
        <input type="text" class="bg-gray-200 disabled:opacity-85 disabled:bg-red-200 cursor-not-allowed" disabled>
        <label for="password" class="p-2">Password</label>
        <input type="text" class="bg-green-100"><br>
        <button class="p-2 m-4 border-2 border-amber-800 bg-amber-100 rounded text-center font-bold active:bg-amber-400">Send</button>
        <br>
        <button class="p-2 m-4 border-2 border-lime-800 bg-lime-100 rounded text-center font-bold disabled:opacity-55 cursor-not-allowed" disabled>Reset all</button>
    </form>
</body>
</html>
